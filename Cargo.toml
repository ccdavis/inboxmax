[workspace]
resolver = "3"
members = ["crates/core", "server", "desktop"]
# The desktop app needs platform WebView libraries (WebKitGTK on Linux), so
# plain `cargo build` / `cargo test` at the root cover only the web stack.
default-members = ["crates/core", "server"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
inboxmax-core = { path = "crates/core" }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
