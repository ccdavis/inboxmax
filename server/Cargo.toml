[package]
name = "inboxmax-server"
description = "Inbox Max web server: multi-user sign-in, sessions, and the HTTP API"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Serve the generated demo mailbox when INBOXMAX_FAKE_MAIL=1 (development and tests).
fake-mail = ["inboxmax-core/fake-mail"]

[dependencies]
inboxmax-core = { workspace = true, features = ["axum"] }

# Web framework
axum = { version = "0.8", features = ["macros"] }
axum-extra = { version = "0.10", features = ["cookie"] }
tower-http = { version = "0.6", features = ["trace", "fs"] }

# Password hashing
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

# Time (for cookie max_age)
time = "0.3"

# Device-token hashing
sha2 = "0.10"
hex = "0.4"

anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
dotenvy = "0.15"

[dev-dependencies]
async-trait.workspace = true
base64 = "0.22"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
