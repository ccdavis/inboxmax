[package]
name = "inboxmax-core"
description = "Mailbox access, storage, and inbox operations shared by the Inbox Max web server and desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Lets web handlers return AppError directly as an HTTP response.
axum = ["dep:axum"]
# Lets INBOXMAX_FAKE_MAIL=1 serve the generated demo mailbox to every
# account (development and end-to-end tests).
fake-mail = []

[dependencies]
axum = { version = "0.8", optional = true, default-features = false }

# IMAP
async-imap = "0.10"
async-native-tls = "0.5"
imap-proto = "0.16"
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"

# Email parsing
mail-parser = "0.9"

# Attachments arrive base64-encoded in JSON
base64 = "0.22"

# Composing and sending (SMTP), over the same native TLS as IMAP
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1", "tokio1-native-tls"] }

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
