[package]
name = "inboxmax-core"
description = "Mailbox access, storage, and inbox operations shared by the Inbox Max web server and desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# Lets web handlers return AppError directly as an HTTP response.
axum = ["dep:axum"]
# A generated in-process mailbox for demos and end-to-end tests.
fake-mail = []

[dependencies]
axum = { version = "0.8", optional = true, default-features = false }

# IMAP
async-imap = "0.10"
async-native-tls = "0.5"
imap-proto = "0.16"
tokio-util = { version = "0.7", features = ["compat"] }
futures = "0.3"

# Email parsing
mail-parser = "0.9"

anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
uuid.workspace = true
